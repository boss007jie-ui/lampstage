<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>灯影工坊 · 卖家工作台方案</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0} body{font-family:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;background:#f7f7f5;color:#171717;line-height:1.45} button,input{font:inherit} .app{min-height:100vh;display:grid;grid-template-columns:248px 1fr} .side{background:#fff;padding:24px 18px;border-right:1px solid #e8e5df;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center;margin-bottom:28px}.mark{width:34px;height:34px;border-radius:10px;background:radial-gradient(circle at 30% 20%,#fff1bc,#c88736 42%,#16110b 85%);box-shadow:0 10px 30px rgba(174,110,35,.25)}.brand b{font-size:18px;letter-spacing:-.5px}.brand span{display:block;color:#777;font-size:12px}.nav a{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:#4d4d4d;padding:10px 12px;border-radius:10px;margin-bottom:5px;font-size:14px}.nav a.active,.nav a:hover{background:#171717;color:#fff}.credits{margin-top:28px;padding:14px;border-radius:14px;background:#faf7ed;border:1px solid #eadfcb}.credits .num{font-size:30px;letter-spacing:-1.3px;font-weight:600}.main{padding:24px 30px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{font-size:32px;letter-spacing:-1.5px}.pill{border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 13px;color:#555}.primary{background:#171717;color:white;border:0;border-radius:10px;padding:11px 16px;cursor:pointer}.ghost{background:white;border:1px solid #e5e1d8;border-radius:10px;padding:10px 14px;cursor:pointer}.workspace{display:grid;grid-template-columns:360px 1fr;gap:20px}.panel{background:white;border-radius:18px;border:1px solid #e8e4dc;box-shadow:0 18px 50px rgba(30,20,10,.05);overflow:hidden}.panel h2{font-size:16px;padding:18px;border-bottom:1px solid #eee9df}.steps{padding:18px}.step{display:flex;gap:12px;margin-bottom:18px}.dot{width:26px;height:26px;border-radius:50%;background:#171717;color:white;display:grid;place-items:center;font-size:12px;flex:none}.upload{height:170px;border:1.5px dashed #c9b89a;border-radius:16px;background:linear-gradient(145deg,#fff,#fbf6ec);display:grid;place-items:center;text-align:center;color:#6b5a3e}.upload strong{display:block;color:#171717;margin-bottom:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.card{border:1px solid #e7e1d7;border-radius:14px;padding:12px;background:#fff;cursor:pointer;transition:.2s}.card:hover,.card.selected{border-color:#171717;box-shadow:0 0 0 3px rgba(23,23,23,.06)}.thumb{height:68px;border-radius:10px;margin-bottom:9px;background:linear-gradient(135deg,#e9dfd0,#7f684d);position:relative;overflow:hidden}.thumb:after{content:"";position:absolute;left:40%;top:16%;width:28px;height:38px;border-radius:50% 50% 45% 45%;background:radial-gradient(circle,#fff8cc,#e9a742 55%,#5e3715);box-shadow:0 0 35px 9px rgba(244,185,72,.55)}.card b{font-size:14px}.card p{font-size:12px;color:#777;margin-top:2px}.seg{display:flex;border:1px solid #e5e1d8;border-radius:12px;padding:3px;background:#fafafa;margin-top:12px}.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px;cursor:pointer;color:#666}.seg button.on{background:#171717;color:#fff}.preview{padding:20px}.canvas{height:520px;border-radius:22px;background:linear-gradient(140deg,#d9c8b3,#f3ece1 45%,#7b6a58);position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}.room-line{position:absolute;left:0;right:0;bottom:145px;height:1px;background:rgba(255,255,255,.5)}.sofa{position:absolute;left:50px;bottom:95px;width:390px;height:116px;background:#cab89f;border-radius:36px 36px 18px 18px;box-shadow:0 20px 45px rgba(50,30,10,.18)}.lamp{position:absolute;right:160px;top:68px;width:84px;height:125px;border-radius:48px 48px 18px 18px;background:radial-gradient(circle at 50% 30%,#fff7c8,#e2a23d 40%,#5c3518 75%);box-shadow:0 0 80px 32px rgba(255,210,101,.45),0 18px 30px rgba(0,0,0,.18)}.badge{position:absolute;top:18px;left:18px;background:rgba(255,255,255,.82);backdrop-filter:blur(16px);border-radius:999px;padding:8px 12px;font-size:13px}.resultbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:16px}.formats span{font-family:'Geist Mono',monospace;font-size:12px;border:1px solid #e5e1d8;border-radius:8px;padding:6px 8px;margin-right:5px;color:#666}.toast{position:fixed;right:24px;bottom:24px;background:#171717;color:#fff;padding:13px 16px;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.2);opacity:0;transform:translateY(12px);transition:.25s}.toast.show{opacity:1;transform:translateY(0)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{height:auto;position:relative}.workspace{grid-template-columns:1fr}.canvas{height:420px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="side"><div class="brand"><div class="mark"></div><div><b>灯影工坊</b><span>AI 灯具电商图工作台</span></div></div><nav class="nav"><a class="active" href="#">生成场景图 <span>⌘G</span></a><a href="#">我的作品</a><a href="#">模板市场</a><a href="#">额度与订单</a><a href="#">帮助中心</a></nav><div class="credits"><p>本月剩余额度</p><div class="num">20</div><p>每生成 1 张消耗 1 次</p></div></aside>
    <main class="main"><div class="top"><div><h1>把灯具商品图变成专业家居场景图</h1><p style="color:#666;margin-top:6px">上传图片，选择空间模板，生成适合淘宝/天猫/1688 与独立站的电商视觉。</p></div><button class="pill">国内电商版 / 独立站版</button></div>
      <section class="workspace"><div class="panel"><h2>生成设置</h2><div class="steps"><div class="step"><div class="dot">1</div><div style="width:100%"><div class="upload"><div><strong>上传灯具商品图</strong><span>支持白底图、透明 PNG、普通商品图</span></div></div></div></div><div class="step"><div class="dot">2</div><div style="width:100%"><b>选择家居场景</b><div class="grid"><div class="card selected"><div class="thumb"></div><b>现代客厅</b><p>高转化主推模板</p></div><div class="card"><div class="thumb" style="background:linear-gradient(135deg,#e6e0d8,#56534c)"></div><b>餐厅吊灯</b><p>餐桌氛围光</p></div><div class="card"><div class="thumb" style="background:linear-gradient(135deg,#f0e7dc,#9a8066)"></div><b>卧室床头</b><p>温馨柔光</p></div><div class="card"><div class="thumb" style="background:linear-gradient(135deg,#ded4c7,#292623)"></div><b>酒店大堂</b><p>高级工程款</p></div></div></div></div><div class="step"><div class="dot">3</div><div style="width:100%"><b>选择平台风格</b><div class="seg"><button class="on">国内电商</button><button>独立站品牌</button></div></div></div><button class="primary" style="width:100%;margin-top:4px" onclick="toast()">生成 4 张预览图</button></div></div>
      <div class="panel"><h2>实时预览</h2><div class="preview"><div class="canvas"><div class="badge">现代客厅 · 淘宝主图 · 4:5</div><div class="room-line"></div><div class="sofa"></div><div class="lamp"></div></div><div class="resultbar"><div class="formats"><span>1:1</span><span>4:5</span><span>16:9</span></div><div><button class="ghost">重新生成</button> <button class="primary">下载高清图</button></div></div></div></div></section></main>
  </div><div id="toast" class="toast">已创建生成任务：预计 35 秒完成，消耗 4 次额度。</div><script>function toast(){const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{document.querySelectorAll('.card').forEach(x=>x.classList.remove('selected'));c.classList.add('selected')});document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});</script>
</body>
</html>

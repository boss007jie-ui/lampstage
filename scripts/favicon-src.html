<!doctype html><html><head><meta charset="utf-8"/>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#888; padding:40px; }
  .ico {
    width:512px; height:512px;
    border-radius:104px;
    background:radial-gradient(125% 115% at 50% -8%, #2c2c44 0%, #1c1c2e 55%, #14141f 100%);
    display:block;
  }
</style></head><body>
  <!-- BrandMark B3 spotlight, scaled to 512, on dark rounded tile -->
  <svg class="ico" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff5b8" stop-opacity="0.98"/>
        <stop offset="0.55" stop-color="#f3a93b" stop-opacity="0.7"/>
        <stop offset="1" stop-color="#f3a93b" stop-opacity="0.08"/>
      </linearGradient>
      <radialGradient id="glow" cx="50%" cy="40%" r="60%">
        <stop offset="0" stop-color="#fff8d8"/>
        <stop offset="55%" stop-color="#ffcf66"/>
        <stop offset="100%" stop-color="#e09a30"/>
      </radialGradient>
    </defs>
    <!-- 光锥 -->
    <path d="M15.2 8 L6 27 L26 27 L16.8 8 Z" fill="url(#beam)"/>
    <!-- 发光源点 + 外发光 -->
    <circle cx="16" cy="7" r="3.6" fill="#f3a93b" fill-opacity="0.35"/>
    <circle cx="16" cy="7" r="2.4" fill="url(#glow)"/>
  </svg>
</body></html>

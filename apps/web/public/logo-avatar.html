<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #888; padding: 30px; display: flex; flex-wrap: wrap; gap: 30px; font-family: -apple-system, "PingFang SC", sans-serif; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .cap { color: #fff; font-size: 14px; }
  .logo { width: 512px; height: 512px; position: relative; overflow: hidden; }

  /* ===== V1: 深色舞台聚光 + 灯 + 文字 ===== */
  .v1 {
    background: radial-gradient(130% 100% at 50% -5%, #2c2c44 0%, #1c1c2e 50%, #12121c 100%);
    display: flex; flex-direction: column; align-items: center;
  }
  .v1 .mount { width: 60px; height: 12px; background: #4a4a5c; border-radius: 0 0 8px 8px; margin-top: 70px; }
  .v1 .cord { width: 6px; height: 60px; background: linear-gradient(#6a6a7a,#3a3a48); }
  .v1 .shade {
    width: 150px; height: 92px; position: relative;
    background: linear-gradient(165deg, #2a2a30, #16161c);
    border-radius: 75px 75px 16px 16px;
    box-shadow: inset 0 -6px 14px rgba(0,0,0,.5), 0 6px 14px rgba(0,0,0,.4);
  }
  .v1 .brass {
    position: absolute; left: 50%; bottom: -4px; transform: translateX(-50%);
    width: 130px; height: 22px; border-radius: 50%;
    background: linear-gradient(#e8c074,#b8862c);
  }
  .v1 .bulb {
    position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%);
    width: 96px; height: 40px; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 25%, #fffae0, #ffcf66 50%, #e09a30);
    box-shadow: 0 0 80px 30px rgba(255,205,100,.85);
  }
  .v1 .beam {
    width: 360px; height: 230px; margin-top: -4px;
    background: linear-gradient(to bottom, rgba(255,224,150,.6), rgba(255,214,130,.12) 65%, transparent 92%);
    clip-path: polygon(50% 0, 50% 0, 92% 100%, 8% 100%);
    filter: blur(8px);
  }
  .v1 .txt { position: absolute; bottom: 56px; width: 100%; text-align: center; color: #f0e6cc; font-size: 30px; font-weight: 600; letter-spacing: 8px; }

  /* ===== V2: 纯 icon,无字,放大灯 ===== */
  .v2 {
    background: radial-gradient(130% 100% at 50% 0%, #2e2e48 0%, #1a1a2a 55%, #101019 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .v2 .shade {
    width: 190px; height: 116px; position: relative; margin-top: -30px;
    background: linear-gradient(165deg, #2a2a30, #16161c);
    border-radius: 95px 95px 20px 20px;
    box-shadow: inset 0 -8px 18px rgba(0,0,0,.5), 0 8px 18px rgba(0,0,0,.4);
  }
  .v2 .brass {
    position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%);
    width: 166px; height: 28px; border-radius: 50%;
    background: linear-gradient(#e8c074,#b8862c);
  }
  .v2 .bulb {
    position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%);
    width: 120px; height: 50px; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 25%, #fffae0, #ffcf66 50%, #e09a30);
    box-shadow: 0 0 100px 40px rgba(255,205,100,.9);
  }
  .v2 .beam {
    width: 420px; height: 250px;
    background: linear-gradient(to bottom, rgba(255,224,150,.65), rgba(255,214,130,.12) 65%, transparent 92%);
    clip-path: polygon(50% 0, 50% 0, 94% 100%, 6% 100%);
    filter: blur(9px);
  }

  /* ===== V3: 浅色版(白底,适合需要浅底的平台) ===== */
  .v3 {
    background: linear-gradient(160deg, #fbf8f1, #efe7d6);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .v3 .shade {
    width: 180px; height: 110px; position: relative; margin-top: -20px;
    background: linear-gradient(165deg, #33333c, #1c1c24);
    border-radius: 90px 90px 18px 18px;
    box-shadow: 0 8px 20px rgba(0,0,0,.25);
  }
  .v3 .brass {
    position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%);
    width: 158px; height: 26px; border-radius: 50%;
    background: linear-gradient(#e8c074,#b8862c);
  }
  .v3 .bulb {
    position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%);
    width: 110px; height: 46px; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 25%, #fffbe8, #ffcf66 55%, #e09a30);
    box-shadow: 0 0 70px 26px rgba(243,169,59,.55);
  }
  .v3 .beam {
    width: 400px; height: 240px;
    background: linear-gradient(to bottom, rgba(243,169,59,.4), rgba(243,169,59,.08) 65%, transparent 92%);
    clip-path: polygon(50% 0, 50% 0, 93% 100%, 7% 100%);
    filter: blur(8px);
  }
</style>
</head>
<body>
  <div class="tile">
    <div class="logo v1">
      <div class="mount"></div><div class="cord"></div>
      <div class="shade"><div class="brass"></div><div class="bulb"></div></div>
      <div class="beam"></div>
      <div class="txt">灯境</div>
    </div>
    <div class="cap">V1 · 深色 + 灯境二字（最完整）</div>
  </div>

  <div class="tile">
    <div class="logo v2">
      <div class="shade"><div class="brass"></div><div class="bulb"></div></div>
      <div class="beam"></div>
    </div>
    <div class="cap">V2 · 深色纯图标（小尺寸最清晰）</div>
  </div>

  <div class="tile">
    <div class="logo v3">
      <div class="shade"><div class="brass"></div><div class="bulb"></div></div>
      <div class="beam"></div>
    </div>
    <div class="cap">V3 · 浅色版</div>
  </div>
</body>
</html>

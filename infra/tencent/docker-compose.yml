services:
  web:
    build:
      context: ../..
      dockerfile: infra/tencent/Dockerfile
      # Empty by default: builds outside mainland China keep the upstream
      # sources. bootstrap-ubuntu.sh probes Tencent's in-VPC mirrors and exports
      # these when they answer. See the note at the top of the Dockerfile.
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    image: lampstage-web:latest
    env_file: .env.prod
    environment:
      NODE_ENV: production
    command: ["npm", "run", "start"]
    expose:
      - "3000"
    restart: unless-stopped
    networks: [lampstage]

  worker:
    image: lampstage-web:latest
    env_file: .env.prod
    environment:
      NODE_ENV: production
      VIDEO_WORK_ROOT: /srv/lampstage/video-work
      VIDEO_HYPIT_PACKAGE_ROOT: /app/apps/web/vendor/hypit
      VIDEO_HYPIT_RUNTIME: /srv/lampstage/runtime/account01.runtime.json
    command: ["npm", "run", "video:worker"]
    volumes:
      - video-work:/srv/lampstage/video-work
      - ./runtime:/srv/lampstage/runtime:ro
    restart: unless-stopped
    networks: [lampstage]

  edge:
    image: caddy:2-alpine
    depends_on: [web]
    environment:
      LAMPSTAGE_DOMAIN: ${LAMPSTAGE_DOMAIN:-lampstage.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks: [lampstage]

volumes:
  video-work:
  caddy-data:
  caddy-config:

networks:
  lampstage:
